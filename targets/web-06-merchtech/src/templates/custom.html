<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MerchTech - Custom Sablon</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">
    <nav class="bg-white p-4 border-b border-gray-200 sticky top-0 z-40">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-tighter text-gray-900 uppercase">MerchTech.</h1>
            <ul class="flex space-x-8 text-sm font-medium">
                <li><a href="/" class="text-gray-500 hover:text-gray-900 transition">Beranda</a></li>
                <li><a href="/custom" class="text-gray-900 border-b-2 border-gray-900 pb-1 transition">Custom Sablon</a></li>
            </ul>
        </div>
    </nav>

    <main class="container mx-auto mt-12 p-4 flex-grow">
        <div class="max-w-xl mx-auto bg-white rounded-xl p-8 border border-gray-200 shadow-sm">
            <div class="text-center mb-8">
                <span class="inline-block bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-xs font-bold mb-4 tracking-widest uppercase">Eksklusif</span>
                <h2 class="text-3xl font-bold mb-3 tracking-tight text-gray-900">Desain Sablon Anda</h2>
                <p class="text-gray-500 text-sm">Masukkan teks atau quotes simpel. Less is more.</p>
            </div>
            
            {% if error %}
            <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-8 flex items-start">
                <svg class="w-5 h-5 mr-3 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <div>
                    <h4 class="font-bold text-sm">Gagal Diproses</h4>
                    <p class="text-xs mt-1">{{ error }}</p>
                </div>
            </div>
            {% endif %}

            <form method="POST" action="/custom" class="space-y-6">
                <div>
                    <label for="message" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Teks Sablon</label>
                    <textarea id="message" name="message" rows="4" class="w-full bg-white border border-gray-300 rounded p-4 text-gray-900 font-mono text-sm focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900 transition" placeholder="Contoh: TATATAKAE">{% if original_message %}{{ original_message }}{% endif %}</textarea>
                </div>
                <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white font-medium py-3 px-6 rounded transition duration-200 shadow-sm">
                    Generate Preview
                </button>
            </form>
        </div>

        {% block preview %}
        {% endblock %}
    </main>

    <footer class="bg-white text-center p-8 border-t border-gray-200 mt-12">
        <p class="text-gray-400 text-sm uppercase tracking-widest">&copy; 2026 MerchTech - Minimalist Edition.</p>
    </footer>
</body>
</html>
