<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberNusa - My Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/dashboard.html" class="navbar-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
            CyberNusa
        </a>
        <div class="navbar-nav">
            <a href="/dashboard.html" class="nav-link">Announcements</a>
            <a href="/documents.html" class="nav-link">Documents</a>
            <a href="/profile.html" class="nav-link" style="color: var(--primary); font-weight: 600;">My Profile</a>
            <a href="/admin.html" class="nav-link" id="adminMenuLink" style="display: none; color: var(--danger);">Admin Panel</a>
            <a href="#" id="logoutBtn" class="nav-link">Sign Out</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2 class="card-title">Employee Profile Settings</h2>
            <div id="alertBox" class="alert"></div>
            
            <form id="profileForm">
                <div class="profile-grid">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="profFullName" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Department</label>
                        <input type="text" id="profDepartment" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="text" id="profPhone" class="form-control">
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label class="form-label">Employee Bio</label>
                        <textarea id="profBio" class="form-control" rows="4"></textarea>
                    </div>
                </div>
                
                <div style="margin-top: 1rem; display: flex; justify-content: flex-end; align-items: center;">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
